<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 2026-11-05：站点 favicon（此前无任何图标声明，浏览器回退请求根路径 /favicon.ico
         得到 502，页签显示 Chrome 默认占位图标）。统一用 %BASE_URL% 前缀（跟随 vite base），
         dev 与 build 产物路径一致，且支持部署到任意子路径。SVG 为现代浏览器主选（任意 DPI
         清晰，Y 已矢量化为路径、不依赖访问者系统字体）；PNG/ICO 为兼容档；apple-touch-icon 供 iOS 主屏。 -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <!-- 部署配置：接口入口地址等，可在构建产物中直接修改，无需重新构建 -->
    <script src="%BASE_URL%config.js"></script>
    <title>YoloWebAgentStarter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
